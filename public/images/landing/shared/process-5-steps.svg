<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="pgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#056BFF" />
      <stop offset="100%" stop-color="#00D5F2" />
    </linearGradient>
  </defs>
  <!-- Connecting line -->
  <line x1="80" y1="80" x2="920" y2="80" stroke="#E2E8F0" stroke-width="4" stroke-dasharray="8 8" />
  <line x1="80" y1="80" x2="500" y2="80" stroke="url(#pgrad)" stroke-width="4" />
  
  <!-- Step 1 -->
  <circle cx="80" cy="80" r="32" fill="#056BFF" />
  <text x="80" y="87" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">1</text>
  <text x="80" y="135" fill="#050A15" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Free Call</text>

  <!-- Step 2 -->
  <circle cx="280" cy="80" r="32" fill="#056BFF" />
  <text x="280" y="87" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">2</text>
  <text x="280" y="135" fill="#050A15" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Fixed Quote</text>

  <!-- Step 3 -->
  <circle cx="500" cy="80" r="32" fill="#056BFF" />
  <text x="500" y="87" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">3</text>
  <text x="500" y="135" fill="#050A15" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Weekly Demos</text>

  <!-- Step 4 -->
  <circle cx="710" cy="80" r="32" fill="#00D5F2" />
  <text x="710" y="87" fill="#050A15" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">4</text>
  <text x="710" y="135" fill="#050A15" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Launch</text>

  <!-- Step 5 -->
  <circle cx="920" cy="80" r="32" fill="#10B981" />
  <text x="920" y="87" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">5</text>
  <text x="920" y="135" fill="#050A15" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Support</text>
</svg>
